name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never interrupt a publish halfway through. A rerun skips versions already on npm.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and pack
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pack-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:package
      - name: Select version or publish
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Pack the validated packages
        id: pack
        if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}

  version:
    name: Open release pull request
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          script: pnpm release:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  publish:
    name: Publish to npm
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install release tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish validated archives with npm OIDC and create GitHub releases
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.prepare.outputs.pack-id }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
